<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Ingresar · WeddingControl</title><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500;1,600&display=swap" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="{{ url_for('static', filename='css/app.css') }}" rel="stylesheet"></head>
<body class="login-page"><section class="login-card"><div class="brand mb-4">Wedding<span>Control</span></div><h1>Bienvenido</h1><p class="text-muted mb-4">Administra cada detalle de tu gran día.</p>{% with messages = get_flashed_messages(with_categories=true) %}{% for category, message in messages %}<div class="alert alert-{{ category }}">{{ message }}</div>{% endfor %}{% endwith %}<form method="post"><div class="mb-3"><label class="form-label">Correo</label><input type="email" class="form-control" name="email" required autofocus></div><div class="mb-4"><label class="form-label">Contraseña</label><input type="password" class="form-control" name="password" required></div><button class="btn btn-dark w-100">Ingresar</button></form></section></body></html>
