{% extends 'base.html' %}{% block title %}{{ 'Editar' if guest else 'Nuevo' }} invitado · WeddingControl{% endblock %}{% block content %}
<div class="mb-4"><p class="eyebrow">Invitados</p><h1>{{ 'Editar invitado' if guest else 'Nuevo invitado' }}</h1></div>
<form method="post" class="card soft-card"><div class="card-body p-4 p-lg-5"><div class="row g-3"><div class="col-md-6"><label class="form-label">Nombre</label><input class="form-control" name="first_name" value="{{ guest.first_name if guest else '' }}" required></div><div class="col-md-6"><label class="form-label">Apellidos</label><input class="form-control" name="last_name" value="{{ guest.last_name if guest else '' }}" required></div><div class="col-md-6"><label class="form-label">Teléfono</label><input class="form-control" name="phone" value="{{ guest.phone if guest and guest.phone else '' }}"></div><div class="col-md-6"><label class="form-label">Correo</label><input type="email" class="form-control" name="email" value="{{ guest.email if guest and guest.email else '' }}"></div><div class="col-md-4"><label class="form-label">Acompañantes</label><input type="number" min="0" class="form-control" name="companions" value="{{ guest.companions if guest else 0 }}"></div><div class="col-md-4"><label class="form-label">Mesa</label><input class="form-control" name="table_number" value="{{ guest.table_number if guest and guest.table_number else '' }}" placeholder="Ej. 4"></div><div class="col-md-4"><label class="form-label">Estado</label><select class="form-select" name="rsvp_status">{% for status in statuses %}<option value="{{ status.value }}" {% if guest and guest.rsvp_status == status %}selected{% endif %}>{{ {'pending':'Pendiente','confirmed':'Confirmado','declined':'No asistirá'}[status.value] }}</option>{% endfor %}</select></div><div class="col-12"><label class="form-label">Restricciones alimenticias</label><input class="form-control" name="dietary_notes" value="{{ guest.dietary_notes if guest and guest.dietary_notes else '' }}"></div><div class="col-12"><label class="form-label">Observaciones</label><textarea class="form-control" name="notes" rows="3">{{ guest.notes if guest and guest.notes else '' }}</textarea></div></div><div class="mt-4 d-flex gap-2"><button class="btn btn-dark">Guardar</button><a class="btn btn-outline-dark" href="{{ url_for('web.guests') }}">Cancelar</a></div></div></form>
{% endblock %}
