<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}WeddingControl{% endblock %}</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500;1,600&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="{{ url_for('static', filename='css/app.css') }}" rel="stylesheet">
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-light bg-white border-bottom px-3 px-lg-5">
    <a class="navbar-brand brand" href="{{ url_for('web.dashboard') }}">Wedding<span>Control</span></a>
    <div class="ms-auto d-flex gap-3 align-items-center">
      <a class="nav-link" href="{{ url_for('web.dashboard') }}">Panel</a><a class="nav-link" href="{{ url_for('web.guests') }}">Invitados</a><a class="nav-link" href="{{ url_for('web.invitations') }}">Invitaciones</a><a class="nav-link" href="{{ url_for('web.settings') }}">Configuración</a>
      <a class="btn btn-sm btn-outline-dark" href="{{ url_for('web.logout') }}">Salir</a>
    </div>
  </nav>
  <main class="container py-5">
    {% with messages = get_flashed_messages(with_categories=true) %}{% for category, message in messages %}<div class="alert alert-{{ category }}">{{ message }}</div>{% endfor %}{% endwith %}
    {% block content %}{% endblock %}
  </main>
</body></html>
